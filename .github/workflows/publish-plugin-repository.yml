name: Plugin-Repository veröffentlichen

# Baut hibiscus.ly.reports, signiert die ZIP und veröffentlicht sie als
# Jameica-Repository auf GitHub Pages. Beschreibung: torac/README.md
#
# Drei Jobs mit je minimalen Rechten:
#   build   baut und testet, ohne Secrets und ohne Environment (auch für Pull-Requests)
#   sign    signiert die ZIP aus "build" mit dem Schlüssel der Environment "release"
#           (nur auf main; die Environment erlaubt ebenfalls nur main)
#   deploy  veröffentlicht das Pages-Artefakt aus "sign" (Environment "github-pages", nur main)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Ein Gruppenschlüssel für den ganzen Lauf (alle drei Jobs):
# - main (push und workflow_dispatch): gemeinsame Gruppe "plugin-repository-publish".
#   Läufe laufen strikt nacheinander in der Reihenfolge ihres Starts. Ein laufender
#   Lauf wird nie abgebrochen; wartet schon einer, ersetzt ihn ein neuerer (der
#   neueste Stand gewinnt). So signiert und veröffentlicht kein älterer Lauf nach
#   einem neueren.
# - Pull-Requests und andere Branches: je Ref eine eigene Gruppe, ein neuer Lauf
#   bricht den laufenden ab. Sie blockieren main nie.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'plugin-repository-publish' || format('plugin-repository-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PLUGIN: hibiscus.ly.reports
  PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
  # Jameica und Hibiscus kommen aus den offiziellen Releases von willuhn.de.
  # Die URLs unter "releases/current" zeigen immer auf die jeweils neueste
  # Version (die Versionsnummer in der URL gehört zur Prüfsumme). Erscheint eine
  # neue, schlägt die Prüfsumme fehl und der Build bricht ab: URL und SHA-256
  # hier nachziehen.
  # Aktuell: Jameica 2.12.0, Hibiscus 2.12.4.
  JAMEICA_URL: https://www.willuhn.de/products/jameica/releases/current/jameica/jameica-2.12.0.zip
  JAMEICA_SHA256: 7a9ec5985563532976e24a3aba97f4f96cef168eae52edd8a85937f8c53fa301
  HIBISCUS_URL: https://www.willuhn.de/products/hibiscus/releases/current/hibiscus-2.12.4.zip
  HIBISCUS_SHA256: d3ef83bbb58297dbf46bd530e0961596aa302f6375dd59c8df846e4a37d8c3f6

jobs:
  build:
    name: Bauen und testen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      zip_sha256: ${{ steps.zip.outputs.sha256 }}
    steps:
      - name: Quellcode holen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Java 17 einrichten
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Ordner festlegen
        run: |
          echo "OUT_DIR=$RUNNER_TEMP/plugin-build" >> "$GITHUB_ENV"
          echo "DEPS_DIR=$RUNNER_TEMP/deps" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/deps/download"

      # Der Cache-Schlüssel ist die SHA-256 der ZIP. Die Prüfsumme wird trotzdem
      # nach jedem Wiederherstellen geprüft; gespeichert wird erst danach.
      - name: Jameica-ZIP aus dem Cache holen
        id: cache-jameica
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/deps/download/jameica.zip
          key: willuhn-zip-${{ env.JAMEICA_SHA256 }}

      - name: Hibiscus-ZIP aus dem Cache holen
        id: cache-hibiscus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/deps/download/hibiscus.zip
          key: willuhn-zip-${{ env.HIBISCUS_SHA256 }}

      - name: Jameica und Hibiscus laden und prüfen
        run: |
          set -euo pipefail
          cd "$DEPS_DIR"
          [ -f download/jameica.zip ]  || curl -sSfL --retry 3 -o download/jameica.zip "$JAMEICA_URL"
          [ -f download/hibiscus.zip ] || curl -sSfL --retry 3 -o download/hibiscus.zip "$HIBISCUS_URL"
          echo "$JAMEICA_SHA256  download/jameica.zip" | sha256sum -c -
          echo "$HIBISCUS_SHA256  download/hibiscus.zip" | sha256sum -c -
          unzip -q download/jameica.zip
          unzip -q download/hibiscus.zip
          test -f jameica/jameica.jar
          test -f hibiscus/hibiscus.jar
          echo "JAMEICA_DIR=$DEPS_DIR/jameica" >> "$GITHUB_ENV"
          echo "HIBISCUS_DIR=$DEPS_DIR/hibiscus" >> "$GITHUB_ENV"

      - name: Jameica-ZIP im Cache ablegen
        if: steps.cache-jameica.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/deps/download/jameica.zip
          key: willuhn-zip-${{ env.JAMEICA_SHA256 }}

      - name: Hibiscus-ZIP im Cache ablegen
        if: steps.cache-hibiscus.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/deps/download/hibiscus.zip
          key: willuhn-zip-${{ env.HIBISCUS_SHA256 }}

      # Prüft, dass build-plugin.sh den Ausgabeordner nie löscht, wenn er das Repo,
      # $HOME, "/" oder ein Elternordner davon ist (arbeitet nur in einem Temp-Ordner).
      - name: Schutzprüfung des Ausgabeordners testen
        run: torac/test-build-plugin-guard.sh

      - name: Plugin bauen (Jar und unsignierte ZIP)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: torac/build-plugin.sh

      - name: Tests ausführen
        run: |
          set -euo pipefail
          CP="$(cat "$OUT_DIR/classpath.txt"):$OUT_DIR/classes"
          mkdir -p "$OUT_DIR/test-classes"
          javac --release 17 -encoding UTF-8 -nowarn -cp "$CP" -d "$OUT_DIR/test-classes" \
            test/de/open4me/hibiscus/reports/mcp/McpJsonRpcHandlerTests.java \
            test/de/open4me/hibiscus/reports/mcp/McpRequestLogTests.java \
            test/de/open4me/hibiscus/reports/mcp/SepaPurposeTests.java \
            test/de/open4me/hibiscus/reports/automation/runtime/AutomationPaymentsTests.java \
            torac/McpRunner.java
          java -cp "$CP:$OUT_DIR/test-classes" McpRunner

      - name: Zertifikat prüfen
        run: |
          set -euo pipefail
          CERT=torac/signing-cert.pem
          # Das Zertifikat darf nur ein Zertifikat sein, kein Schlüssel.
          if grep -q 'PRIVATE KEY' "$CERT"; then
            echo "::error::$CERT enthält Schlüsselmaterial"
            exit 1
          fi
          openssl x509 -in "$CERT" -noout -subject -enddate
          openssl x509 -in "$CERT" -noout -checkend 2592000 \
            || { echo "::error::Das Zertifikat läuft in weniger als 30 Tagen ab oder ist abgelaufen"; exit 1; }
          FP="$(openssl x509 -in "$CERT" -noout -fingerprint -sha256 | cut -d= -f2)"
          grep -qF "$FP" torac/README.md \
            || { echo "::error::SHA-256-Fingerabdruck $FP steht nicht in torac/README.md"; exit 1; }
          echo "Fingerabdruck stimmt mit torac/README.md überein: $FP"

      # Prüft nur die Mechanik (openssl signieren und prüfen) mit einem Schlüssel,
      # der in diesem Schritt entsteht und danach verschwindet. Der
      # Produktionsschlüssel kommt hier nicht vor; nichts davon wird hochgeladen.
      - name: Signier-Mechanik mit Wegwerf-Schlüssel testen
        run: |
          set -euo pipefail
          umask 077
          T="$(mktemp -d "$RUNNER_TEMP/signing-selftest.XXXXXX")"
          trap 'rm -rf "$T"' EXIT
          ZIP="$OUT_DIR/unsigned/$PLUGIN.zip"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=selftest" \
            -keyout "$T/key.pem" -out "$T/cert.pem" 2>/dev/null
          openssl x509 -in "$T/cert.pem" -pubkey -noout > "$T/pub.pem"
          openssl dgst -sha1 -sign "$T/key.pem" -out "$T/zip.sha1" "$ZIP"
          openssl dgst -sha1 -verify "$T/pub.pem" -signature "$T/zip.sha1" "$ZIP"
          # Gegenprobe: eine veränderte ZIP darf nicht mehr durchgehen.
          cp "$ZIP" "$T/tampered.zip"
          printf 'x' >> "$T/tampered.zip"
          if openssl dgst -sha1 -verify "$T/pub.pem" -signature "$T/zip.sha1" "$T/tampered.zip" >/dev/null 2>&1; then
            echo "::error::Eine veränderte ZIP wurde als gültig geprüft"
            exit 1
          fi
          echo "Selbsttest der Signier-Mechanik bestanden"

      - name: Prüfsumme der ZIP festhalten
        id: zip
        run: |
          set -euo pipefail
          echo "sha256=$(sha256sum "$OUT_DIR/unsigned/$PLUGIN.zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Die ZIP ist unsigniert und lässt sich nicht über ein Jameica-Repository
      # installieren. In Pull-Requests dient sie nur zum manuellen Testen.
      - name: Unsignierte ZIP als Artefakt ablegen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event_name == 'pull_request' && format('plugin-zip-unsigned-{0}', github.event.pull_request.number) || 'plugin-zip-unsigned' }}
          path: ${{ env.OUT_DIR }}/unsigned
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Signieren
    needs: build
    # Nur der Stand von main wird signiert, nie Pull-Requests oder andere Branches.
    # Dieser Job führt keinen Code aus dem Repo aus (nur Schritte aus diesem
    # Workflow) und nimmt die fertige ZIP aus "build".
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      # Ein erneuter Lauf (Re-run) baut die ZIP neu, mit anderen Bytes, aber
      # gleicher Versionsnummer. Das darf nicht veröffentlicht werden.
      - name: Nur im ersten Versuch eines Laufs signieren
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo "::error::Dieser Lauf ist ein erneuter Versuch (Versuch $GITHUB_RUN_ATTEMPT). Ein Re-run erzeugt eine andere ZIP mit derselben Versionsnummer und wird nicht signiert. Bitte einen neuen Lauf starten: Actions, Run workflow (workflow_dispatch) auf main."
            exit 1
          fi

      - name: Zertifikat und Vorlage holen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: torac
          persist-credentials: false

      - name: Unsignierte ZIP holen
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-zip-unsigned
          path: ${{ runner.temp }}/unsigned

      - name: ZIP prüfen
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.zip_sha256 }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/unsigned"
          echo "$EXPECTED_SHA256  $PLUGIN.zip" | sha256sum -c -
          unzip -tq "$PLUGIN.zip"
          # Alles liegt unter einem Ordner "hibiscus.ly.reports/", plugin.xml ist die mitgelieferte.
          if unzip -Z1 "$PLUGIN.zip" | grep -v "^$PLUGIN/"; then
            echo "::error::Die ZIP enthält Einträge außerhalb von $PLUGIN/"
            exit 1
          fi
          unzip -p "$PLUGIN.zip" "$PLUGIN/plugin.xml" | cmp - plugin.xml
          echo "Version: $(cat version.txt)"

      # Sicherung gegen Rückschritte: Ist auf Pages schon eine Version veröffentlicht,
      # die gleich oder größer ist als die dieses Laufs, wird nicht signiert.
      # Versionen werden numerisch je Komponente verglichen (major.minor.patch).
      - name: Veröffentlichte Version prüfen
        run: |
          set -euo pipefail
          URL="$PAGES_BASE_URL/$PLUGIN/plugin.xml"
          PUBLISHED="$RUNNER_TEMP/published-plugin.xml"
          CODE="$(curl -sS -L --retry 3 -H 'Cache-Control: no-cache' -o "$PUBLISHED" -w '%{http_code}' "$URL?run=$GITHUB_RUN_ID")"
          case "$CODE" in
            404)
              echo "Unter $URL ist noch nichts veröffentlicht, weiter."
              exit 0
              ;;
            200) ;;
            *)
              echo "::error::Die veröffentlichte plugin.xml ließ sich nicht abrufen (HTTP $CODE, $URL)."
              exit 1
              ;;
          esac
          python3 -I - "$PUBLISHED" "$RUNNER_TEMP/unsigned/plugin.xml" <<'PY'
          import re, sys
          import xml.etree.ElementTree as ET

          def version(path):
              v = ET.parse(path).getroot().get("version") or ""
              if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", v):
                  sys.exit("::error::Version %r in %s ist nicht von der Form X.Y.Z" % (v, path))
              return v, tuple(int(x) for x in v.split("."))

          published, published_key = version(sys.argv[1])
          current, current_key = version(sys.argv[2])
          print("Veröffentlicht: %s, dieser Lauf: %s" % (published, current))
          if published_key >= current_key:
              sys.exit("::error::Auf Pages ist bereits Version %s veröffentlicht, dieser Lauf hat %s (nicht größer). Es wird nicht signiert und nicht veröffentlicht, damit kein Rückschritt entsteht. Bitte einen neuen Lauf starten: Actions, Run workflow auf main." % (published, current))
          PY

      # Der einzige Schritt mit dem Schlüssel. Die Datei liegt im Runner-Temp mit
      # Rechten nur für den Besitzer und wird sofort wieder gelöscht.
      - name: ZIP signieren
        env:
          PLUGIN_SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          [ -n "$PLUGIN_SIGNING_KEY" ] || { echo "::error::Das Secret PLUGIN_SIGNING_KEY der Environment release fehlt"; exit 1; }
          KEY_FILE="$(mktemp "$RUNNER_TEMP/signing-key.XXXXXX")"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$PLUGIN_SIGNING_KEY" > "$KEY_FILE"
          openssl dgst -sha1 -sign "$KEY_FILE" -out "$RUNNER_TEMP/unsigned/$PLUGIN.zip.sha1" "$RUNNER_TEMP/unsigned/$PLUGIN.zip"
          rm -f "$KEY_FILE"
          trap - EXIT
          echo "Signatur erzeugt ($(wc -c < "$RUNNER_TEMP/unsigned/$PLUGIN.zip.sha1") Bytes)"

      - name: Signatur gegen das eingecheckte Zertifikat prüfen
        run: |
          set -euo pipefail
          if grep -q 'PRIVATE KEY' torac/signing-cert.pem; then
            echo "::error::torac/signing-cert.pem enthält Schlüsselmaterial"
            exit 1
          fi
          openssl x509 -in torac/signing-cert.pem -pubkey -noout > "$RUNNER_TEMP/signing-pub.pem"
          cd "$RUNNER_TEMP/unsigned"
          openssl dgst -sha1 -verify "$RUNNER_TEMP/signing-pub.pem" -signature "$PLUGIN.zip.sha1" "$PLUGIN.zip"

      - name: Repository zusammenstellen
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/site"
          mkdir -p "$SITE/$PLUGIN"
          cp "$RUNNER_TEMP/unsigned/$PLUGIN.zip" "$RUNNER_TEMP/unsigned/$PLUGIN.zip.sha1" "$RUNNER_TEMP/unsigned/plugin.xml" "$SITE/$PLUGIN/"
          cp torac/signing-cert.pem "$SITE/signing-cert.pem"
          sed "s|@PAGES_BASE_URL@|$PAGES_BASE_URL|g" torac/repository.xml > "$SITE/repository.xml"
          if grep -q '@PAGES_BASE_URL@' "$SITE/repository.xml"; then
            echo "::error::Platzhalter in repository.xml nicht ersetzt"
            exit 1
          fi
          python3 -I -c 'import sys, xml.etree.ElementTree as ET; [ET.parse(f) for f in sys.argv[1:]]; print("XML wohlgeformt")' \
            "$SITE/repository.xml" "$SITE/$PLUGIN/plugin.xml"
          # Auf die Seite gehört kein Schlüsselmaterial.
          if grep -rIl 'PRIVATE KEY' "$SITE"; then
            echo "::error::Schlüsselmaterial im Pages-Inhalt"
            exit 1
          fi
          find "$SITE" -type f | sort

      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Auf GitHub Pages veröffentlichen
    needs: sign
    # Nur der Stand von main wird veröffentlicht, nie Pull-Requests oder andere Branches.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
